# Qdrant — the vector database, run from a native binary.
#
# The binary is not in the kit: there is no Homebrew formula, so you unpack the release archive
# for your machine into the path `bin` names below, the same way you install the engine and the
# model weights.
#
# Both parameters are paths and both are read by qdrant.sh. Everything else about Qdrant — where
# the storage goes, which ports it binds — lives in the config `config` names, which the panel
# wrote for you on first launch and never touches again. Moving the storage means moving the
# corpus: stop Qdrant, move the directory, change the line there.
id: qdrant
name: Qdrant
health:
  kind: http
  url: http://127.0.0.1:6333/healthz
start: nohup bash ~/.config/letapis-app/services/qdrant.sh &
restart_policy: manual
stop:
  kind: port
  port: 6333
logs:
  kind: file
  path: /tmp/letapis-qdrant.log
config:
  file: ~/.config/letapis-app/services/qdrant.yaml
  params:
    bin: ~/.local/letapis-qdrant/bin/qdrant
    config: ~/.local/letapis-qdrant/config.yaml
