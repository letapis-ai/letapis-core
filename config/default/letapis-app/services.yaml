# The panel's service index. It has two halves, and only one of them is yours.
#
# `services:` is yours — which cards run and in what order. Order matters: the database comes
# before the models and the models before the engine. `boot_stack: true` means the panel brings
# the whole stack up when it launches; set it false and the rows stay grey until you press Start.
#
# `seeded:` is the panel's own memory: every card it has ever written here itself. A file seeded
# on your machine carries that list; this sample does not, because nothing has been written for
# anybody yet. It is the only thing that tells "the person removed this" apart from "we never
# laid it", and without it a card you delete comes back on the next launch.
#
# SO TO REMOVE A CARD FOR GOOD: delete its `conf:` line, and LEAVE its name in `seeded:`.
# Clearing the name as well reads as "never laid it", and the card comes back.
#
# Paths may use `~`; the panel expands it. It writes this file with absolute paths when it
# seeds a fresh install, which is the same thing spelled the long way.
#
# `services/` holds more cards than this list names — docker.yaml, podman.yaml and
# qdrant-docker.yaml are laid down ready to use and pointed at by nothing. They are the
# container path, and it is a choice rather than the default: Qdrant runs from a native binary
# because on macOS a container puts its storage behind a virtual-machine file layer, and a
# memory-mapped database wants the real one.
#
# TURNING THE CONTAINER PATH ON IS AN EXCHANGE, NOT AN ADDITION. Port 6333 is one port,
# so exactly one Qdrant line belongs here: replace `qdrant.yaml` below with
# `qdrant-docker.yaml`. Add `docker.yaml` (or `podman.yaml`) as well if you want to watch the
# runtime's own state — the panel hides a runtime card on a machine that does not have it.
autostart:
  boot_stack: true
services:
- conf: ~/.config/letapis-app/services/qdrant.yaml
- conf: ~/.config/letapis-app/services/embedder.yaml
- conf: ~/.config/letapis-app/services/reranker.yaml
- conf: ~/.config/letapis-app/services/letapis-bin.yaml
