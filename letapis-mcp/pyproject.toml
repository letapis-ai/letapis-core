[project]
name = "letapis-mcp"
version = "0.1.0"
description = "MCP client for letapis - semantic code search and knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Dev" }
]
keywords = ["mcp", "letapis", "semantic-search", "code-search", "knowledge-graph"]

dependencies = [
    # AN UPPER BOUND, not "whatever is newest". Installing FROM GIT
    # (`uvx --from "git+…#subdirectory=letapis-mcp"`) does not apply `uv.lock` — it resolves
    # against THIS file. Unbounded, that brought in mcp 2.0.0, where `Server` no longer carries
    # `list_tools()`, and the proxy died on import before printing anything:
    # `server.py:71 AttributeError: 'Server' object has no attribute 'list_tools'`
    # `[measured on a clean cache, 2026-08-09]`.
    #
    # A clone never saw it: `uv run --project` reads the lock (mcp 1.26.0), so the two install
    # paths disagreed and only one of them was ever tried here. The bound is what makes the
    # git path work without `--with mcp==…` pasted into a recipient's command.
    #
    # It does NOT pin: inside 1.x the git path still takes the newest (1.29.0 today) while a
    # clone stays on the locked 1.26.0. Both run — that is the property being bought here.
    # Moving to mcp 2.x is a different job with a different risk: the decorators this code is
    # written against are gone there.
    "mcp>=1.0.0,<2",        # Official MCP SDK
    "httpx>=0.28.0",        # HTTP client for letapis-core API
    "pyyaml>=6.0.0",        # Config file support
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
letapis-mcp = "letapis_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letapis_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.metadata]
allow-direct-references = true
